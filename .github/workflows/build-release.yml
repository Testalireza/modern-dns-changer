name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install customtkinter keyboard pyinstaller pillow pystray

      - name: Generate icon
        run: python generate_icon.py

      - name: Build executable
        run: pyinstaller build.spec --clean --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModernDNSChanger
          path: dist/ModernDNSChanger.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ModernDNSChanger.exe
          name: Modern DNS Changer ${{ github.ref_name }}
          body: |
            ## Modern DNS Changer ${{ github.ref_name }}
            
            ### Features
            - 🌐 One-click DNS switching for WiFi adapter
            - 📋 Custom DNS presets (preferred + secondary)
            - ⌨️ Global hotkey toggle between two presets
            - 📱 System tray icon with minimize-to-tray
            - 🎨 Dark mode & Light mode
            - 🌐 English & Persian (فارسی) language support
            - 🪟 Windows 11 native styling (Mica, rounded corners)
            - ⚡ Auto-admin elevation on launch
            
            ### Download
            Download `ModernDNSChanger.exe` below, no Python needed.
            Double-click to run — it will prompt for admin access.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
